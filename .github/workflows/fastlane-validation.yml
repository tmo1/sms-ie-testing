name: fastlane-validation

on:
  push:
    paths:
      - 'fastlane/**'
  pull_request:
    paths:
      - 'fastlane/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FASTLANE_CHANGED_FILES: './fastlane-changed-files'
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p FASTLANE_CHANGED_FILES
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            changed:
              - '**'
      - name: create tree of changed files
        if: steps.filter.outputs.changed == 'true'
        run: cp --parents ${{ steps.filter.outputs.changed_files }} FASTLANE_CHANGED_FILES
      - name: check new directory  
        run: ls -R FASTLANE_CHANGED_FILES
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2
        with:
          fastlaneDir: FASTLANE_CHANGED_FILES
