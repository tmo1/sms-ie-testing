name: fastlane-validation

on:
  push:
    paths:
      - 'fastlane/**'
  pull_request:
    paths:
      - 'fastlane/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p /tmp/fastlane-metadata
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            changed:
              - '**'
      - name: create tree of changed files
        if: steps.filter.outputs.changed == 'true'
        run: cp ${{ steps.filter.outputs.changed_files }} /tmp/fastlane-metadata/
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2
        with:
          fastlaneDir: /tmp/fastlane-metadata
